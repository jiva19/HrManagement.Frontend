<div class="login-container">
  <div class="login-card">
    <h2>Sign In</h2>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          required
          data-testid="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          data-testid="password"
        />
      </div>

      <button type="submit" data-testid="login-btn">
        Login
      </button>

      <div class="error" *ngIf="errorMessage" data-testid="error">
        {{ errorMessage }}
      </div>

      <div class="success" *ngIf="isLoggedIn" data-testid="welcome">
        <span class="success-icon">✓</span>
        <p>Welcome back, <strong>{{ username }}</strong>!</p>
      </div>

    </form>
  </div>
</div>
